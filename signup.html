<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainForge | Create Account</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" href="logobackg.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #5b4bdb;
            --primary-glow: rgba(91, 75, 219, 0.35);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            overflow-x: hidden;
        }

        .signup-container {
            width: 100%;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .signup-inner {
            width: 100%;
            max-width: 440px;
        }

        .brand-icon-box {
            width: 64px;
            height: 64px;
            background: #0b0f19;
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 20px rgba(91, 75, 219, 0.4);
            overflow: hidden;
            border: 1px solid #e5e7ef;
        }

        .brand-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin: 0 0 28px 0;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13px;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 15px;
            z-index: 2;
        }

        .input-field {
            width: 100%;
            padding: 13px 16px 13px 46px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            color: #0f172a;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .input-field:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(91, 75, 219, 0.12);
        }

        /* CUSTOM ANIMATED GRADE SELECTOR DROPDOWN */
        .custom-select-box {
            position: relative;
            width: 100%;
            cursor: pointer;
        }

        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 13px 16px 13px 46px;
            font-size: 14px;
            color: #0f172a;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .custom-select-box.open .custom-select-trigger {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(91, 75, 219, 0.12);
        }

        .custom-select-trigger i.fa-chevron-down {
            color: #94a3b8;
            transition: transform 0.3s ease;
        }

        .custom-select-box.open .custom-select-trigger i.fa-chevron-down {
            transform: rotate(180deg);
            color: var(--primary);
        }

        .custom-options-container {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.15);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .custom-select-box.open .custom-options-container {
            max-height: 280px;
            overflow-y: auto;
            opacity: 1;
            padding: 6px;
        }

        .custom-option {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-option:hover {
            background: #efedff;
            color: var(--primary);
            padding-left: 18px;
        }

        .custom-option.selected {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #5b4bdb 0%, #7665ec 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(91, 75, 219, 0.3);
            transition: all 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(91, 75, 219, 0.4);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
        }

        .footer-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        /* Inline In-UI Mobile Feedback Banner */
        #uiMessageBanner {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: center;
        }
        #uiMessageBanner.error {
            background: #ffeeec;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="signup-inner">
            <div class="brand-icon-box">
                <img src="logobackg.png" alt="BrainForge Logo">
            </div>
            
            <h1>Create Account</h1>
            <p class="subtitle">Enter your details and choose your grade level to begin.</p>

            <div id="uiMessageBanner"></div>

            <div class="social-buttons">
                <button type="button" class="social-btn" onclick="handleSocialSignup('Google')">
                    <i class="fab fa-google" style="color: #ea4335;"></i> Google
                </button>
                <button type="button" class="social-btn" onclick="handleSocialSignup('Apple')">
                    <i class="fab fa-apple" style="color: #000000;"></i> Apple
                </button>
            </div>

            <div class="divider">Or with Email</div>

            <form id="signupForm" onsubmit="handleAccountCreation(event)">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa fa-user"></i>
                        <input type="text" id="fullName" class="input-field" placeholder="Enter your name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="studentEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa fa-envelope"></i>
                        <input type="email" id="studentEmail" class="input-field" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="studentPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa fa-lock"></i>
                        <input type="password" id="studentPassword" class="input-field" placeholder="Create a strong password" required>
                    </div>
                </div>

                <!-- Custom Animated Grade Selector (Grades 1 to 10) -->
                <div class="input-group">
                    <label>Choose Grade Level</label>
                    <div class="custom-select-box" id="gradeSelectBox">
                        <i class="fa fa-graduation-cap" style="position: absolute; left: 16px; top: 14px; color: #94a3b8; font-size: 15px; z-index: 2;"></i>
                        <div class="custom-select-trigger" onclick="toggleGradeDropdown(event)">
                            <span id="selectedGradeText" style="color: #94a3b8;">Select your grade</span>
                            <i class="fa fa-chevron-down"></i>
                        </div>
                        <div class="custom-options-container" id="gradeOptionsList">
                            <div class="custom-option" onclick="selectGrade('1', 'Grade 1', event)">Grade 1</div>
                            <div class="custom-option" onclick="selectGrade('2', 'Grade 2', event)">Grade 2</div>
                            <div class="custom-option" onclick="selectGrade('3', 'Grade 3', event)">Grade 3</div>
                            <div class="custom-option" onclick="selectGrade('4', 'Grade 4', event)">Grade 4</div>
                            <div class="custom-option" onclick="selectGrade('5', 'Grade 5', event)">Grade 5</div>
                            <div class="custom-option" onclick="selectGrade('6', 'Grade 6', event)">Grade 6</div>
                            <div class="custom-option" onclick="selectGrade('7', 'Grade 7', event)">Grade 7</div>
                            <div class="custom-option" onclick="selectGrade('8', 'Grade 8', event)">Grade 8</div>
                            <div class="custom-option" onclick="selectGrade('9', 'Grade 9', event)">Grade 9</div>
                            <div class="custom-option" onclick="selectGrade('10', 'Grade 10', event)">Grade 10</div>
                        </div>
                    </div>
                    <input type="hidden" id="studentGradeValue" required>
                </div>

                <button type="submit" class="submit-btn">
                    Launch BrainForge <i class="fa fa-arrow-right"></i>
                </button>
            </form>

            <div class="footer-text">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script>
        function showBanner(message) {
            const banner = document.getElementById("uiMessageBanner");
            banner.innerText = message;
            banner.className = "error";
            banner.style.display = "block";
        }

        function toggleGradeDropdown(e) {
            e.stopPropagation();
            const box = document.getElementById("gradeSelectBox");
            box.classList.toggle("open");
        }

        function selectGrade(value, label, event) {
            event.stopPropagation();
            document.getElementById("studentGradeValue").value = value;
            
            const triggerText = document.getElementById("selectedGradeText");
            triggerText.innerText = label;
            triggerText.style.color = "#0f172a";
            triggerText.style.fontWeight = "600";

            document.querySelectorAll(".custom-option").forEach(opt => opt.classList.remove("selected"));
            event.currentTarget.classList.add("selected");

            document.getElementById("gradeSelectBox").classList.remove("open");
        }

        window.addEventListener("click", () => {
            const box = document.getElementById("gradeSelectBox");
            if (box) box.classList.remove("open");
        });

        function handleAccountCreation(event) {
            event.preventDefault();
            const name = document.getElementById("fullName").value.trim();
            const email = document.getElementById("studentEmail").value.trim();
            const password = document.getElementById("studentPassword").value;
            const grade = document.getElementById("studentGradeValue").value;

            if (!name || !email || !password || !grade) {
                showBanner("Please fill in all required fields and select your grade level.");
                return;
            }

           localStorage.setItem("registeredEmail", email);
        localStorage.setItem("registeredPassword", password);
        localStorage.setItem("brainforgeUser", name);
        localStorage.setItem("studentName", name);
        localStorage.setItem("studentGrade", grade);
        localStorage.setItem("userXP", "0");
        localStorage.setItem("userLevel", "1");          // <-- Add this
        localStorage.setItem("userRank", "Brain Rookie"); // <-- Add this
        localStorage.setItem("userCoins", "50");        

            window.location.href = "index.html";
        }

        function handleSocialSignup(provider) {
            const mockName = provider + " User";
            localStorage.setItem("brainforgeUser", mockName);
            localStorage.setItem("studentName", mockName);
            localStorage.setItem("studentGrade", "7");
            localStorage.setItem("userXP", "0");
            localStorage.setItem("userCoins", "50");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
